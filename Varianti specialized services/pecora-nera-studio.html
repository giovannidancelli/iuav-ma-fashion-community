<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pecora Nera Studio: Specialized Services: IMAC</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --blue: rgb(1, 0, 226); --yellow: rgb(255, 244, 182); }
html, body { width: 100%; min-height: 100%; background: #ffffff; font-family: 'LFT Etica Mono', 'Courier New', monospace; color: var(--blue); }
#menu-box { position: fixed; top: 0; left: 0; bottom: 0; width: 240px; padding: 48px 24px; border-right: 1px solid var(--blue); z-index: 20; background: #ffffff; }
#menu-box nav { display: flex; flex-direction: column; gap: 4px; }
#menu-box nav a { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; font-size: 18px; font-weight: 700; letter-spacing: 0.03em; line-height: 1.8; }
#menu-box nav a:hover { text-decoration: none; }
.content { margin-left: 240px; padding: 28px 48px 80px 32px; display: flex; flex-direction: column; }
.header { margin-bottom: 0; }
.header h1 { font-family: 'LFT Etica Light', 'LFT Etica', sans-serif; font-weight: 300; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1; margin-bottom: 10px; }
.header h1 + * { margin-bottom: 28px; }
.divider { height: 1px; background: var(--blue); margin-left: -32px; margin-bottom: 0; }
.profile-section { background: var(--blue); margin-left: -32px; margin-right: -48px; padding: 36px 48px 48px 32px; display: grid; grid-template-columns: 240px 1fr; gap: 40px; align-items: start; }
.photo-wrap { width: 100%; aspect-ratio: 3 / 4; overflow: hidden; max-height: 320px; }
.photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-info { display: flex; flex-direction: column; gap: 22px; }
.info-rule { height: 1px; background: rgba(255, 244, 182, 0.2); }
.company-desc { font-family: 'LFT Etica Light', 'LFT Etica', sans-serif; font-weight: 300; font-size: 14px; line-height: 1.7; color: var(--yellow); }
.website-link { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); background: var(--yellow); border: 1px solid var(--yellow); padding: 10px 20px; text-decoration: none; transition: color 0.2s, background 0.2s; }
.website-link:hover { color: var(--yellow); background: var(--blue); }
.info-block h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--yellow); margin-bottom: 10px; }
.info-block p, .info-block a:not(.website-link) { font-family: 'LFT Etica Light', 'LFT Etica', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.75; color: var(--yellow); text-decoration: none; }
.contacts-row { display: flex; flex-direction: column; gap: 14px; }

@media (max-width: 768px) {

  /* sidebar → horizontal top bar */
  #menu-box {
    position: fixed; top: 0; left: 0; right: 0; bottom: auto;
    width: 100%; height: auto; padding: 10px 14px;
    border-right: none; border-bottom: 1px solid var(--blue);
    z-index: 100; background: #ffffff;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #menu-box nav { flex-direction: row; flex-wrap: nowrap; gap: 0 14px; overflow-x: auto; }
  #menu-box nav a { font-size: 13px; white-space: nowrap; line-height: 2.4; letter-spacing: 0.03em; }
  #site-logo { height: 70px; top: 8px; right: 12px; }

  /* main content */
  .content { margin-left: 0 !important; padding-top: 54px !important; padding-left: 14px !important; padding-right: 14px !important; }
  .header h1, .header h1 { font-size: clamp(1.4rem, 6vw, 2rem); }
  .divider, .header-inner-divider { margin-left: -14px; }
  .grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
  .grid-section { margin-left: -14px !important; margin-right: -14px !important; padding-left: 14px !important; padding-right: 14px !important; }
  .student-name { font-size: 12px !important; }
  .project-title { font-size: 12px !important; }
}
</style>
</head>
<body>
<div id="menu-box">
  <nav>
    <a href="../index.html">home</a>
    <a href="../about-us.html">about us</a>
    <a href="../living-archive.html">living archive</a>
    <a href="../lets-network.html">let's network</a>
    <a href="../lets-share.html">let's share</a>
  </nav>
</div>
<div class="content">
  <div class="header"><h1>Pecora Nera Studio</h1></div>
  <div class="divider"></div>
  <div class="profile-section">
    <div class="photo-wrap"><img src="Immagini/pecora-nera.jpg" alt="Pecora Nera Studio"></div>
    <div class="profile-info">
      <div class="info-block">
        <p class="company-desc">Contemporary knitwear brand and studio from Milan combining artisan craft with technology, producing each piece by hand with high-quality Italian yarns and a research-driven approach.</p>
      </div>
      <div class="info-rule"></div>
      <div class="info-block">
        <h2>Contacts</h2>
        <div class="contacts-row">
          <div>
            <p>Milano</p>
          </div>
        </div>
      </div>
      <div class="info-rule"></div>
      <div class="info-block">
        <a href="https://www.instagram.com/pecoranerastudio/" target="_blank" class="website-link">instagram ↗</a>
      </div>
    </div>
  </div>
</div>
<script src="../search.js" data-root="../"></script>
</body>
</html>
